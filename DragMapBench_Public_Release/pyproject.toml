[project]
name = "dragmapbench-formal-experiments"
version = "0.1.0"
description = "Reproducible formal experiments for DragMapBench V5.2"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
local = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.34",
]
stats = [
  "scipy>=1.12",
  "pandas>=2.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dragmap-formal = "dragmap_formal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
